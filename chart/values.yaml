# Deployment config
replicaCount: 2

image:
  repository: eb-test
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# App config — read into container via ConfigMap
config:
  appName: eb-app
  version: "1.0.0"

# Network
service:
  port: 8080

ingress:
  enabled: true
  host: demo.local

# Resources — start conservative, you can tune later
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"
